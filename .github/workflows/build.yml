name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default; only the release job gets write access.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      # Verify the committed gradle-wrapper.jar against published checksums.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      # Builds Java 8 bytecode (options.release 8) on a newer JDK.
      - run: ./gradlew test shadowJar --no-daemon
      # Shaded jar only; the -plain jar is unshaded and won't load on a server.
      - uses: actions/upload-artifact@v4
        with:
          name: thorium-minecraft-jar
          path: build/libs/thorium-minecraft-*[0-9].jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew shadowJar --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          # Fails if no jar matches rather than publishing an empty release.
          files: build/libs/thorium-minecraft-*[0-9].jar
          fail_on_unmatched_files: true
          generate_release_notes: true
