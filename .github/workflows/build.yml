name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# No workflow-wide write: only the release job creates anything, and every
# other job here - including the one that runs a build script off a pull
# request - gets a read-only token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      # gradle-wrapper.jar is committed to this repository, so CI runs whatever
      # bytecode is in it. Check it against the published checksums first.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      # The plugin targets Java 8 bytecode (options.release 8) so it runs on
      # older servers; the toolchain that builds it does not have to be Java 8.
      - run: ./gradlew test shadowJar --no-daemon
      # Ends in a digit: the shaded jar is thorium-minecraft-<version>.jar and
      # the unshaded one is thorium-minecraft-<version>-plain.jar, which starts
      # NoClassDefFoundError-ing the moment a server loads it.
      - uses: actions/upload-artifact@v4
        with:
          name: thorium-minecraft-jar
          path: build/libs/thorium-minecraft-*[0-9].jar
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew shadowJar --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          # Same pin: the plain jar must never reach a release page, and a
          # release with no jar on it must fail rather than publish empty.
          files: build/libs/thorium-minecraft-*[0-9].jar
          fail_on_unmatched_files: true
          generate_release_notes: true
